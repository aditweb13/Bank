version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amc_bank_postgres
    restart: always
    environment:
      POSTGRES_DB: amc_bank_customer_login
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amc_bank_customer_login"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./amc-backend
      dockerfile: Dockerfile
    container_name: amc_bank_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/amc_bank_customer_login
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-AMC-Bank-Super-Secure-Ultra-Long-Secret-Key-For-Production-HMAC256-Bit-Security}
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./amc-frontend
      dockerfile: Dockerfile
    container_name: amc_bank_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
