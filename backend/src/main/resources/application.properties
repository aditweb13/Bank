spring.application.name=arbc-bank-enterprise
server.port=8080

# Environment Variable configuration with fallback defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arbc_bank_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway DB Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:AMC-Bank-Classroom-JWT-Secret-Key-2026-Change-In-Production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# Loan & Repayment Configuration
amc.banking.loan.late-fee-rate=0.02
amc.banking.loan.foreclosure-fee-rate=0.02
amc.banking.loan.overdue-cron=0 0 1 * * ?
spring.task.scheduling.pool.size=2

# Funds Transfer Configuration
amc.banking.transfer.per-transaction-limit=50000.00
amc.banking.transfer.daily-limit=200000.00

# Deposit Request (Maker-Checker) Configuration
amc.banking.deposit.min-amount=100.00
amc.banking.deposit.max-amount=10000000.00
amc.banking.deposit.large-deposit-threshold=1000000.00
amc.banking.deposit.separation-of-duties=true

