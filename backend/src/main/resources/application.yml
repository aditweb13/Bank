spring:
  application:
    name: arbc-bank-enterprise
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arbc_bank_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

spring:
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:ARBC-Bank-Classroom-JWT-Secret-Key-2026-Change-In-Production}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

amc:
  banking:
    loan:
      late-fee-rate: 0.02
      foreclosure-fee-rate: 0.02
      overdue-cron: "0 0 1 * * ?"
    transfer:
      per-transaction-limit: 50000.00
      daily-limit: 200000.00
    deposit:
      min-amount: 100.00
      max-amount: 10000000.00
      large-deposit-threshold: 1000000.00
      separation-of-duties: true
